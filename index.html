<script>
/* ===== DATA ===== */
let R=Math.random;
const rnd=(a,b)=>Math.floor(R()*(b-a+1))+a;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const seedRng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const CATS={logic:['Logic','🧩'],math:['Math','➗'],memory:['Memory','🧠'],pattern:['Pattern','🔷'],know:['Knowledge','🌍'],word:['Word','🔤']};
const DN=['Easy','Medium','Hard','Expert'],COL={logic:'#a78bfa',math:'#60a5fa',memory:'#f472b6',pattern:'#22d3ee',know:'#4ade80',word:'#fbbf24'};
const key=x=>x.q+(x.show||'')+(x.kk||'');const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const Bank={S:[],G:{},
 add(c,d,q,o,e){this.S.push({c,d,q,o,e})},
 gen(c,f){(this.G[c]=this.G[c]||[]).push(f)},
 make(c,d,used){
  const pool=this.S.filter(x=>x.c==c&&x.d==d&&!used.has(key(x))),g=this.G[c];
  if(pool.length&&(!g||R()<.55))return pool[rnd(0,pool.length-1)];
  if(g)for(let t=0;t<25;t++){const x=g[rnd(0,g.length-1)](d);x.c=c;x.d=d;if(!used.has(key(x)))return x}
  const any=this.S.filter(x=>x.c==c&&!used.has(key(x)));
  return any.length?any[rnd(0,any.length-1)]:null}};
const wrong=(a,d=1)=>{const sp=Math.max(3,Math.round(Math.abs(a)*(0.12+d*0.08))),s=new Set([a]);while(s.size<4)s.add(a+rnd(-sp,sp)||a+1);return[a,...[...s].slice(1)]};

Bank.gen('math',d=>{const t=rnd(0,3),k=d+1;let q,a,e;
 if(t==0){const x=rnd(5*k,25*k),y=rnd(3*k,15*k),p=rnd(0,1);a=p?x+y:x-y;q=`${x} ${p?'+':'−'} ${y} = ?`;e=`${x} ${p?'+':'−'} ${y} = ${a}.`}
 else if(t==1){const x=rnd(2,5+3*d),y=rnd(3,9+3*d);a=x*y;q=`${x} × ${y} = ?`;e=`${x} × ${y} = ${a}.`}
 else if(t==2){const x=rnd(2,5+3*d),y=rnd(2,9),z=rnd(2,10+5*d);a=x*y+z;q=`${x} × ${y} + ${z} = ?`;e=`Perkalian dulu: ${x*y} + ${z} = ${a}.`}
 else{const n=rnd(50,100)*k,s=rnd(2,4+d),m=rnd(3,8);a=n-s*m;q=`Hitung mundur dari ${n}, kurangi ${s} sebanyak ${m} kali. Hasilnya?`;e=`${n} − (${s} × ${m}) = ${a}.`}
 return{q,o:wrong(a,d),e}});
const pnext=t=>{const r=new Set(),[a,b,c,d]=t,d1=b-a,d2=c-b,d3=d-c;
 if(d1==d2&&d2==d3)r.add(d+d1);if(a&&b/a==c/b&&c/b==d/c)r.add(d*(b/a));if(d2-d1==d3-d2)r.add(d+d3+(d3-d2));if(c==a+b&&d==b+c)r.add(c+d);return r};
const pgen=d=>{const t=rnd(0,Math.min(d+1,3)),s=rnd(1,9);let a,e,k;
 if(t==0){k=rnd(2,4+d*3);a=[0,1,2,3,4].map(i=>s+k*i);e=`Selisih tetap +${k}.`}
 else if(t==1){k=rnd(2,3);a=[0,1,2,3,4].map(i=>s*k**i);e=`Setiap suku dikali ${k}.`}
 else if(t==2){k=rnd(1,3);let v=s;a=[v];for(let i=1;i<5;i++){v+=k*i;a.push(v)}e=`Selisihnya naik: ${k}, ${2*k}, ${3*k}, ${4*k}.`}
 else{a=[s,rnd(2,6)];for(let i=2;i<5;i++)a.push(a[i-1]+a[i-2]);e='Setiap suku adalah jumlah dua suku sebelumnya.'}
 return{q:`${a.slice(0,4).join(', ')}, ?`,o:wrong(a[4],d),e:`${e} Suku berikutnya: ${a[4]}.`}};
Bank.gen('pattern',d=>{let q;for(let i=0;i<40;i++){q=pgen(d);if(pnext(q.q.split(', ').slice(0,4).map(Number)).size==1)break}return q});
Bank.gen('pattern',d=>{const S=shuf(['🔺','🔵','🟩','⭐','🟣','🔶','⬜','🖤']),L=rnd(2,3+(d>1?1:0)),u=S.slice(0,L),n=L*2+1,seq=[...Array(n)].map((_,i)=>u[i%L]),c=u[n%L];
 return{q:seq.join(' ')+'  ?',o:[c,...S.filter(x=>x!=c).slice(0,3)],e:`Pola ${u.join('')} berulang terus.`}});
Bank.gen('pattern',d=>{const base=shuf([1,2,3,4,5,6,7,8,9]).slice(0,3+d),seq=[...base,...base.slice().reverse()];
 return{q:`Pola: ${seq.slice(0,seq.length-1).join(', ')}, ?`,o:wrong(seq[seq.length-1],d),e:`Pola mirror: ${base.join(', ')} lalu dibalik.`}});
Bank.gen('pattern',d=>{const a=rnd(2,8),b=rnd(3,9),start=rnd(5,20);let seq=[start];for(let i=0;i<4;i++)seq.push(seq[i]+(i%2===0?a:b));
 return{q:`${seq.slice(0,4).join(', ')}, ?`,o:wrong(seq[4],d),e:`Selisih bergantian +${a} dan +${b}.`}});
Bank.gen('memory',d=>{const A=R()<.5?'0123456789'.split(''):['🟥','🟦','🟩','🟨','🟪'],n=3+d+(A.length>5?1:0),
 seq=[...Array(n)].map(()=>A[rnd(0,A.length-1)]),c=seq.join(' '),s=new Set([c]);
 while(s.size<4){const m=seq.slice(),i=rnd(0,n-1);m[i]=A.filter(x=>x!=m[i])[rnd(0,A.length-2)];s.add(m.join(' '))}
 return{q:'Urutan apa yang tadi ditampilkan?',show:c,o:[...s],e:`Urutan yang benar: ${c}.`}});
const WD=[['BUKU','MEJA','RUMAH','TANAH','HUTAN','AIR','API','BATU'],['SEKOLAH','PELANGI','KEBUN','MATAHARI','GUNUNG','SUNGAI'],['KOMPUTER','PERPUSTAKAAN','TELEVISI','PENGGARIS','KALENDER'],['PENGETAHUAN','KEMERDEKAAN','PEMERINTAHAN','TEKNOLOGI','KESEHATAN']];
Bank.gen('word',d=>{const L=WD[Math.min(d,WD.length-1)],w=L[rnd(0,L.length-1)];let sc=w;for(let t=0;t<30&&sc==w;t++)sc=shuf(w.split('')).join('');
 return{q:`Susun huruf menjadi kata: ${sc}`,o:[w,...shuf(WD.flat().filter(x=>x!=w)).slice(0,3)],e:`Huruf-huruf itu membentuk kata ${w}.`}});
Bank.gen('word',d=>{const pairs=[['cerdas','pandai','bodoh'],['gagah','berani','penakut'],['hemat','irit','boros'],['rapi','tertib','berantakan'],['jujur','lurus','curang'],['tenang','damai','riuh'],['luas','lapang','sempit'],['sehat','bugar','sakit']];
 const[p,s,a]=pairs[rnd(0,pairs.length-1)],syn=R()<.5,c=syn?s:a,trap=syn?a:s;
 return{q:`${syn?'Sinonim':'Antonim'} dari "${p}"?`,o:[c,trap,...shuf(['besar','kecil','cepat','lambat','indah','buruk']).filter(x=>x!=c&&x!=trap).slice(0,2)],e:`"${p}" bersinonim dengan "${s}" dan berantonim dengan "${a}".`}});
Bank.gen('logic',d=>{const n=3+(d>1?1:0),N=shuf(['Andi','Budi','Citra','Dewi','Eko','Fajar']).slice(0,n),t=R()<.5,
 q=N.slice(0,-1).map((x,i)=>`${x} lebih ${t?'tinggi':'berat'} dari ${N[i+1]}`).join('. ')+`. Siapa yang paling ${t?'pendek':'ringan'}?`,
 o=[N[n-1],...N.slice(0,n-1)];if(n==3)o.push('Tidak dapat ditentukan');
 return{q,o,e:`Urutannya ${N.join(' > ')}, jadi ${N[n-1]} paling ${t?'pendek':'ringan'}.`}});
Bank.gen('logic',d=>{const names=shuf(['Rina','Sita','Tono','Udin','Vina']).slice(0,4);
 return{q:`${names[0]} berdiri di depan ${names[1]}. ${names[2]} di belakang ${names[1]}. Siapa di posisi paling belakang?`,
 o:[names[2],names[0],names[1],names[3]],e:`Urutan dari depan: ${names[0]} → ${names[1]} → ${names[2]}.`}});
Bank.gen('logic',d=>{return{q:`Jika semua A adalah B, dan beberapa B adalah C, maka:`,o:['Beberapa A mungkin C','Semua A adalah C','Tidak ada A yang C','Semua C adalah A'],e:`Dari premis hanya bisa disimpulkan bahwa beberapa A mungkin termasuk C.`}});

const TB={
 cap:[['Indonesia','Jakarta'],['Jepang','Tokyo'],['Prancis','Paris'],['Inggris','London'],['Mesir','Kairo'],['Italia','Roma'],['Jerman','Berlin'],['Malaysia','Kuala Lumpur'],['Thailand','Bangkok'],['Korea Selatan','Seoul'],
  ['Australia','Canberra'],['Kanada','Ottawa'],['Brasil','Brasilia'],['Turki','Ankara'],['Swiss','Bern'],['Maroko','Rabat'],['Vietnam','Hanoi'],['Filipina','Manila'],['Argentina','Buenos Aires'],['Spanyol','Madrid'],
  ['Kazakhstan','Astana'],['Nigeria','Abuja'],['Selandia Baru','Wellington'],['Myanmar','Naypyidaw'],['Pakistan','Islamabad'],['Kenya','Nairobi'],['Peru','Lima'],['Norwegia','Oslo'],['Finlandia','Helsinki'],['Kamboja','Phnom Penh']],
 sym:[['Hidrogen','H'],['Oksigen','O'],['Karbon','C'],['Nitrogen','N'],['Helium','He'],['Emas','Au'],['Perak','Ag'],['Besi','Fe'],['Natrium','Na'],['Kalium','K'],['Tembaga','Cu'],

  const info=s.mode=='time'?`⏱ ${s.left}s`:s.mode=='survival'?`${'❤️'.repeat(Math.max(0,s.lives))} #${s.i}`:`${s.i}/${s.N}`;
  const pct=s.mode=='time'?s.left/60*100:s.mode=='survival'?s.lives/3*100:(s.i-1)/s.N*100;
  this.show(`<div><div class="top"><button class="x" data-a="quit" aria-label="Keluar">✕</button><div class="grow"><div class="bar"><i id="pb" style="width:${pct}%"></i></div></div><b class="pill" id="sc">⭐ ${s.score}</b></div>
  <div class="meta"><span>${CATS[q.c][1]} ${CATS[q.c][0]} · ${DN[q.d]}${s.st>=3?` · 🔥${s.st}`:''}${s.practice?' · Latihan':''}</span><span id="inf">${info}</span></div>
  <div class="card qc" style="border-left:4px solid ${COL[q.c]}"><p class="q" id="qt">${q.show?'Perhatikan urutan ini dan ingat baik-baik':q.q}</p>${q.show?`<div class="seq" id="seq">${q.show}</div>`:''}</div>
  ${q.tl?`<div class="seq" id="tp" style="min-height:44px"></div><div class="opts tiles ${q.show?'hid':''}" id="opts">${q.tl.map((o,i)=>`<button class="tile" data-a="tile" data-i="${i}">${o}</button>`).join('')}</div>`:`<div class="opts ${q.show?'hid':''} ${q.grid?'g3':''}" id="opts">${q.opts.map((o,i)=>`<button class="opt" data-a="opt" data-i="${i}"><i>${'ABCD'[i]}</i><span>${o}</span></button>`).join('')}</div>`}<div id="fb"></div></div>`,'nq','play');
  if(q.show)this.mt=setTimeout(()=>{const e=document.getElementById('seq');if(!e)return;e.remove();document.getElementById('qt').textContent=q.q;document.getElementById('opts').classList.remove('hid')},1500+q.show.split(' ').length*650)},
 tick(){const s=G.s,e=document.getElementById('inf'),p=document.getElementById('pb');if(s.left<=5&&s.left>0)Sfx.p(880,.06,'square');if(e){e.textContent=`⏱ ${Math.max(0,s.left)}s`;e.classList.toggle('warn',s.left<=10)}if(p)p.style.width=Math.max(0,s.left)/60*100+'%'},
 mark(v,ok,btn){const s=G.s,q=s.q,bs=document.querySelectorAll('.opt');
  bs.forEach((b,i)=>{if(q.opts[i]===q.o[0])b.classList.add('ok')});
  if(!ok&&btn&&!btn.classList.contains('tile'))btn.classList.add('no');
  document.getElementById('sc').textContent='⭐ '+s.score;
  flash(ok);if(btn){const r=btn.getBoundingClientRect();if(ok){burst(r.left+r.width/2,r.top+r.height/2);floatTxt(r.left+r.width/2,r.top,'+'+s.gain)}}
  if(s.mode=='time')return;
  const last=s.i>=s.N||(s.mode=='survival'&&s.lives<=0);
  document.getElementById('fb').innerHTML=`<div class="card fb ${ok?'g':'r'}"><b>${ok?'Benar! +'+s.gain+' poin'+(s.st>1?' · 🔥 streak '+s.st:''):'Belum tepat'}</b><p>${q.e}</p><button class="cta" data-a="next">${last?'Lihat hasil':'Lanjut'}</button></div>`;
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})},
 result(){const s=G.s,r=s.res,d=Store.d,L=lvOf(d.xp),La=xpAt(L),Lb=xpAt(L+1),Lp=Math.min(100,Math.round((d.xp-La)/(Lb-La)*100));
  const ev=r.acc>=90?'Luar biasa. Penalaranmu sangat tajam.':r.acc>=70?'Bagus. Coba naikkan tingkat kesulitan.':r.acc>=50?'Cukup baik. Latihan rutin akan membantu.':'Masih perlu latihan. Mulai dari Easy dan baca penjelasan tiap soal.';
  this.show(`<div class="res"><h2>${s.mode=='survival'?'Game Over':s.mode=='time'?'Waktu habis!':'Selesai!'}</h2><div class="big">${s.score}</div><small>skor</small>
  <div class="grid"><div class="card"><b>${s.ok}</b><small>Benar</small></div><div class="card"><b>${s.bad}</b><small>Salah</small></div><div class="card"><b>${r.acc}%</b><small>Akurasi</small></div><div class="card"><b>${fmt(r.t)}</b><small>Waktu</small></div></div>
  <div class="card">+${r.xp} XP${r.bonus?' (bonus harian +50)':''}${r.streakBonus?` (streak +${r.streakBonus})`:''}${r.prac?' (latihan, tanpa XP)':''}<br><small>Streak terbaik sesi ini: ${s.bs}</small></div>
  <div class="card"><b>Level ${L} · ${RANKS[Math.min(5,Math.floor((L-1)/3))]}</b><div class="bar"><i style="width:${Lp}%"></i></div><small>${d.xp-La} / ${Lb-La} XP ke level berikutnya</small></div>
  ${r.up?`<div class="card up">🎉 Naik ke level ${lvOf(d.xp)}!</div>`:''}${r.um.map(m=>`<div class="card up">🔓 Mode terbuka: ${m.n}</div>`).join('')}${r.na.map(a=>`<div class="card up">${a[1]} <b>${a[2]}</b><br><small>${a[3]}</small></div>`).join('')}
  <p>${ev}</p>
  ${s.wrongs&&s.wrongs.length?`<button class="ghost w" data-a="review">📋 Lihat ${s.wrongs.length} Jawaban Salah</button>`:''}
  <button class="ghost w" data-a="share">📤 Bagikan Hasil</button>
  <button class="cta" data-a="again">PLAY AGAIN</button><div class="row" style="margin-top:0"><button class="ghost" data-a="menu">BACK TO MENU</button><button class="ghost" data-a="stats">VIEW STATISTICS</button></div></div>`);
  if(r.up||r.na.length){Sfx.up();burst(innerWidth/2,innerHeight/3,30)}else if(r.acc>=70)burst(innerWidth/2,innerHeight/3,18);countUp(this.root.querySelector('.big'),s.score);if(r.up&&!calm()){const e=document.createElement('div');e.className='lvu';e.innerHTML=`LEVEL UP!<b>${L}</b>`;document.body.appendChild(e);setTimeout(()=>e.remove(),1900)}},
 share(){const s=G.s,r=s.res,mode=MODES[s.mode]?.n||s.mode;
  const txt=`🧠 NEURO QUEST\nMode: ${mode}\nSkor: ${s.score} · Akurasi: ${r.acc}%\nBenar ${s.ok}/${r.tot} · Streak terbaik: ${s.bs}\n+${r.xp} XP\n\nAsah otakmu juga!`;
  this.show(`<div><button class="back" data-a="backres">← Hasil</button><h2>Bagikan Hasil</h2>
  <div class="share-box" id="sharetxt">${esc(txt).replace(/\n/g,'<br>')}</div>
  <button class="cta" data-a="copy">📋 Salin Teks</button>
  <p class="mu">Salin lalu tempel ke WhatsApp / Instagram / Twitter.</p></div>`)},
 review(){const s=G.s;if(!s||!s.wrongs||!s.wrongs.length)return this.result();
  this.show(`<div><button class="back" data-a="backres">← Hasil</button><h2>Jawaban Salah (${s.wrongs.length})</h2>
  <div class="card wrong-list">${s.wrongs.map((w,i)=>`<div class="wrong-item"><b>${i+1}. ${esc(w.q)}</b><small>Benar: <b style="color:var(--ok)">${esc(w.a)}</b><br>${esc(w.e)}</small></div>`).join('')}</div>
  <button class="cta" data-a="backres">Kembali ke Hasil</button></div>`)},
 ach(){this.tab='ach';const d=Store.d,n=Object.keys(d.ach).length;
  this.show(`<div><button class="back" data-a="menu">← Menu</button><h2>Achievement</h2><p class="mu">${n} dari ${ACH.length} terbuka</p><div class="bar"><i style="width:${n/ACH.length*100}%"></i></div>
  ${ACH.map(a=>{const ok=d.ach[a[0]];return`<div class="card hr ${ok?'':'lock'}"><span class="mi">${ok?a[1]:'🔒'}</span><span class="grow"><b>${a[2]}</b><br><small>${a[3]} · +${a[5]||30} XP</small></span>${ok?`<small>${ok}</small>`:''}</div>`}).join('')}</div>`)},
 stats(){this.tab='stats';const d=Store.d,acc=d.answered?Math.round(d.correct/d.answered*100):0,B=(n,t)=>`<div class="card"><b>${n}</b><br><small>${t}</small></div>`;
  this.show(`<div><button class="back" data-a="menu">← Menu</button><h2>Statistik</h2>
  <div class="grid">${B(d.score,'Skor total')}${B(d.correct,'Jawaban benar')}${B(d.answered-d.correct,'Jawaban salah')}${B(d.hi,'Skor tertinggi')}${B(d.games?Math.round(d.score/d.games):0,'Rata-rata skor')}${B(d.games,'Game dimainkan')}${B(d.answered,'Soal dijawab')}${B(acc+'%','Akurasi')}${B(d.bestStreak,'Streak jawaban terbaik')}${B(dsNow(),'Hari beruntun')}${B(d.xp,'Total XP')}${B(Object.keys(d.ach).length+'/'+ACH.length,'Achievement')}</div>
  <div class="card">${sw(d)}</div><h3>Akurasi per kategori</h3>${Object.entries(CATS).map(([k,v])=>{const a=d.cat[k]||[0,0],p=a[1]?Math.round(a[0]/a[1]*100):0;return`<div class="crow"><span>${v[1]} ${v[0]}</span><div class="bar"><i style="width:${p}%"></i></div><small>${a[1]?p+'%':'-'}</small></div>`}).join('')}
  <h3>Riwayat terakhir</h3>${d.hist.length?d.hist.slice(0,10).map(h=>`<div class="card hr"><span>${MODES[h.m]?.n||h.m}</span><b>${h.sc}</b><small>${h.acc}% · +${h.xp||0} XP · ${h.dt}</small></div>`).join(''):'<p class="mu">Belum ada permainan. Tekan PLAY NOW untuk mulai.</p>'}
  ${d.wrongLog&&d.wrongLog.length?`<h3>Soal yang sering salah</h3><div class="card wrong-list" style="max-height:180px">${d.wrongLog.slice(0,8).map(w=>`<div class="wrong-item"><b>${esc(w.q)}</b><small>Benar: ${esc(w.a)}</small></div>`).join('')}</div>
  <button class="ghost w" data-a="wrongplay" style="margin-top:8px">📝 Latihan dari soal salah</button>`:''}</div>`)},
 settings(){this.tab='set';this.show(`<div><button class="back" data-a="menu">← Menu</button><h2>Pengaturan</h2>
  <button class="card tog" data-a="snd"><span>Suara</span><b>${Store.d.sound?'ON 🔊':'OFF 🔇'}</b></button>
  <button class="card tog" data-a="vib"><span>Getaran</span><b>${Store.d.vibrate?'ON 📳':'OFF'}</b></button>
  <button class="card tog" data-a="anim"><span>Animasi</span><b>${Store.d.anim?'ON ✨':'OFF'}</b></button>
  <div class="card"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="${Math.round(Store.d.vol*100)}"></div>
  <div class="row" style="margin-top:12px"><button class="ghost" data-a="export">📤 Export</button><button class="ghost" data-a="import">📥 Import</button></div>
  <input type="file" id="imp" accept=".json,application/json" style="display:none">
  <p class="mu" style="margin-top:16px">Bank soal: ${Bank.fixed()}+ fixed + generator dinamis.<br>
  NEURO QUEST <b>v1.3</b> · Full (Phase 1–6)<br>
  Offline · Single-file · Mobile-first</p>
  <button class="ghost w" data-a="reset" style="margin-top:14px;color:#fca5a5">Reset semua progres</button></div>`);
  document.getElementById('imp').onchange=e=>{if(e.target.files[0])Store.import(e.target.files[0])}}};

Store.load();UI.root=document.getElementById('app');
document.addEventListener('input',e=>{if(e.target.id=='vol')Store.d.vol=e.target.value/100});document.addEventListener('change',e=>{if(e.target.id=='vol'){Store.save();Sfx.tap()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)UI.act(b.dataset.a,b.dataset,b)});
UI.menu();if(Store.fail)toast('Penyimpanan browser tidak tersedia, progres tidak akan tersimpan.');
addEventListener('error',()=>{try{if(G.s){G.s.over=true;clearInterval(G.s.tm)}toast('Terjadi kesalahan. Kembali ke menu.');UI.menu()}catch(e){}});
try{history.pushState(null,'');addEventListener('popstate',()=>{history.pushState(null,'');if(UI.scr=='play'){if(confirm('Keluar dari permainan? Hasil sesi ini tidak disimpan.'))G.quit()}else if(UI.scr!='menu')UI.menu()})}catch(e){}
/* Light PWA: register empty SW if possible for offline feel */
if('serviceWorker' in navigator){try{const swCode=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));`;
 const blob=new Blob([swCode],{type:'application/javascript'});navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{})}catch(e){}}
</script>
</body>
</html>
